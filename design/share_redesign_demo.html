<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareBro · Share tab redesign</title>
<style>
  :root { --accent:#FF8A6B; --ink:#F2EFF5; --muted:rgba(242,239,245,.64); --faint:rgba(242,239,245,.40); --line:rgba(255,255,255,.12); --ok:#3EDC8A; --s:.86; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#050309; }
  body { color:var(--ink); font-family:Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; min-height:100vh;
         display:flex; flex-wrap:wrap; gap:34px; justify-content:center; align-items:flex-start; padding:24px 16px 48px; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .i { display:block; flex:none; } .i.fill { fill:currentColor; }

  /* ---------------- Side panel ---------------- */
  .side { width:340px; max-width:100%; }
  .side h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; }
  .side .lead { color:var(--muted); font-size:13.5px; line-height:1.6; margin-top:6px; }
  .side h4 { font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); margin:22px 0 10px; }
  .dirs { display:grid; gap:8px; margin-top:16px; }
  .dirs button { text-align:left; padding:12px 14px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.03); display:flex; gap:12px; align-items:center; transition:all .25s; }
  .dirs button i { width:38px; height:38px; border-radius:12px; flex:none; }
  .dirs button b { display:block; font-size:14.5px; }
  .dirs button span { font-size:12px; color:var(--muted); line-height:1.4; }
  .dirs button.on { border-color:rgba(255,138,107,.7); background:rgba(255,138,107,.09); box-shadow:0 0 0 3px rgba(255,138,107,.12); }
  .sw-A { background:radial-gradient(circle at 35% 35%,#FFB49C,#FF8A6B 40%,#8E1F3E); }
  .sw-B { background:#0e0b14; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -4px 0 #FF8A6B; }
  .sw-C { background:conic-gradient(from 200deg,#8E1F3E,#6E1A62,#3A27A6,#0C6A6E,#9C4614,#8E1F3E); }
  .states { display:flex; flex-wrap:wrap; gap:8px; }
  .states button { padding:8px 13px; border-radius:999px; border:1px solid var(--line); font-size:12.5px; font-weight:500; background:rgba(255,255,255,.04); }
  .states button:hover { border-color:rgba(255,255,255,.3); }
  .tips { list-style:none; display:grid; gap:7px; }
  .tips li { font-size:12.8px; color:var(--muted); line-height:1.5; padding-left:16px; position:relative; }
  .tips li::before { content:''; position:absolute; left:2px; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .tips b { color:var(--ink); font-weight:600; }

  /* ---------------- Phone ---------------- */
  .stage { position:relative; flex:none; }
  .phone { position:absolute; width:412px; height:892px; transform-origin:0 0; border-radius:54px; overflow:hidden; background:#050309;
           box-shadow:0 0 0 11px #0d0b12, 0 0 0 12px rgba(255,255,255,.09), 0 50px 140px rgba(110,26,98,.38); isolation:isolate; user-select:none; }
  .aur { position:absolute; inset:-10%; z-index:0; }
  .aur b { position:absolute; width:80%; height:55%; border-radius:50%; filter:blur(50px); opacity:.9; animation:drift 22s ease-in-out infinite alternate; }
  .aur b:nth-child(1) { left:-15%; top:-5%;  background:radial-gradient(#8E1F3E 0, transparent 68%); }
  .aur b:nth-child(2) { left:40%;  top:12%;  background:radial-gradient(#6E1A62 0, transparent 68%); animation-duration:27s; animation-delay:-6s; }
  .aur b:nth-child(3) { left:-20%; top:45%;  background:radial-gradient(#3A27A6 0, transparent 68%); animation-duration:25s; animation-delay:-11s; }
  .aur b:nth-child(4) { left:38%;  top:66%;  background:radial-gradient(#0C6A6E 0, transparent 68%); animation-duration:30s; animation-delay:-3s; }
  .aur b:nth-child(5) { left:25%;  top:30%; width:55%; height:35%; background:radial-gradient(#9C4614 0, transparent 68%); animation-duration:20s; animation-delay:-14s; opacity:.7; }
  @keyframes drift { 0% { transform:translate(0,0) scale(1); } 50% { transform:translate(9%,6%) scale(1.12); } 100% { transform:translate(-7%,-5%) scale(.95); } }
  .veil { position:absolute; inset:0; z-index:1; transition:background .6s;
          background:radial-gradient(120% 80% at 50% 40%, rgba(5,3,9,.12), rgba(5,3,9,.66)), linear-gradient(rgba(5,3,9,.3), rgba(5,3,9,.1) 40%, rgba(5,3,9,.5)); }
  .dB .veil { background:radial-gradient(120% 80% at 50% 40%, rgba(5,3,9,.6), rgba(5,3,9,.9)), linear-gradient(rgba(5,3,9,.55), rgba(5,3,9,.5) 40%, rgba(5,3,9,.75)); }
  .dC .veil { background:radial-gradient(120% 80% at 50% 40%, rgba(5,3,9,.12), rgba(5,3,9,.6)), linear-gradient(rgba(5,3,9,.25), rgba(5,3,9,.1) 40%, rgba(5,3,9,.45)); }
  .sbar { position:absolute; left:0; right:0; top:0; height:50px; z-index:6; display:flex; justify-content:space-between; align-items:flex-start; padding:15px 30px 0;
          font-size:14px; font-weight:600; background:linear-gradient(rgba(5,3,9,.95) 45%, rgba(5,3,9,0)); pointer-events:none; }
  .sbar .r { display:flex; gap:6px; align-items:center; }
  .cam { position:absolute; top:12px; left:50%; width:20px; height:20px; margin-left:-10px; border-radius:50%; background:#000; z-index:7; box-shadow:inset 0 0 0 4px #111; }
  .scroll { position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; padding:44px 0 136px; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .scroll.tall { padding-bottom:220px; }
  .float { position:absolute; inset:0; z-index:4; pointer-events:none; } .float > * { pointer-events:auto; }
  .fx { position:absolute; inset:0; z-index:8; pointer-events:none; }
  .home { position:absolute; bottom:8px; left:50%; width:124px; height:4px; margin-left:-62px; border-radius:2px; background:rgba(255,255,255,.8); z-index:6; }

  /* The floating dock: same as the app (unchanged). */
  .dock { position:absolute; left:20px; right:20px; bottom:36px; height:68px; border-radius:34px; padding:6px; z-index:5; display:flex;
          background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 45%), rgba(28,26,34,.62); backdrop-filter:blur(18px) saturate(1.4);
          border:1px solid rgba(255,255,255,.157); box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .dock .drop { position:absolute; top:6px; bottom:6px; left:calc(6px + (100% - 12px) * .8); width:calc((100% - 12px) / 5); border-radius:28px;
                background:rgba(255,138,107,.18); border:1px solid rgba(255,138,107,.235); }
  .dock .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; font-weight:500; color:rgba(242,239,245,.745); position:relative; }
  .dock .tab.on { color:var(--accent); font-weight:700; }

  /* Shared bits */
  .gl { background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,0) 42%), rgba(28,26,34,.56); backdrop-filter:blur(22px) saturate(1.4);
        border:1px solid rgba(255,255,255,.13); box-shadow:0 10px 30px rgba(0,0,0,.28); }
  .acts { display:flex; justify-content:flex-end; gap:2px; padding:2px 10px 0; }
  .hb { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; position:relative; transition:transform .15s; }
  .badge { position:absolute; top:6px; right:5px; min-width:17px; height:17px; border-radius:9px; background:var(--accent); color:#2A0D06; font-size:10.5px; font-weight:800; display:grid; place-items:center; padding:0 4px; animation:pop .4s cubic-bezier(.3,1.6,.5,1); }
  .badge[hidden] { display:none; }
  .ttl { font-size:42px; font-weight:800; letter-spacing:-1.4px; padding:2px 20px 0; line-height:1.1; }
  .pad { padding:0 16px; }
  .txt { color:var(--accent); font-weight:700; font-size:14px; padding:8px 4px; }
  .note { font-size:12.5px; color:var(--muted); line-height:1.55; margin:12px 4px 0; }
  .note.dim { color:var(--faint); margin-top:6px; }
  .info { display:flex; align-items:center; gap:8px; margin:18px auto 0; font-size:12.5px; color:var(--muted); padding:8px 14px; border-radius:999px; }
  .info svg:last-child { transition:transform .3s; } .info.open svg:last-child { transform:rotate(90deg); }
  .dot { position:absolute; right:1px; bottom:1px; width:13px; height:13px; border-radius:50%; background:var(--ok); border:2.5px solid #17121f; }
  .off .dot { background:#6d6680; }
  .live { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; animation:live 1.8s infinite; }
  @keyframes live { 0% { box-shadow:0 0 0 0 rgba(62,220,138,.6); } 70%,100% { box-shadow:0 0 0 8px rgba(62,220,138,0); } }
  button:active, .dev:active .bub, .drow:active, .cardC:active, .srow:active, .tile:active, .sess:active { transform:scale(.97); }
  button, .drow, .cardC, .srow, .tile { transition:transform .15s; }

  /* Item thumbnails (same everywhere) */
  .th { position:relative; flex:none; width:68px; height:68px; border-radius:16px; overflow:hidden; background:#221d2c; }
  .th-photo { background:linear-gradient(160deg, var(--a), var(--b)); }
  .th-photo::before { content:''; position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(255,255,255,.6); top:16%; right:18%; }
  .th-photo::after { content:''; position:absolute; left:-20%; right:20%; bottom:-28%; height:62%; background:rgba(0,0,0,.22); border-radius:50% 60% 0 0; }
  .th .vd { position:absolute; left:5px; bottom:5px; z-index:1; display:flex; align-items:center; gap:2px; font-size:9.5px; font-weight:700; background:rgba(0,0,0,.5); border-radius:6px; padding:2px 5px 2px 3px; }
  .th-file { background:linear-gradient(160deg,#2c2537,#1a1622); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .th .ext { font-size:9.5px; font-weight:800; padding:3px 6px; border-radius:6px; background:var(--c); color:#fff; letter-spacing:.3px; }
  .th .fn { font-size:9px; color:var(--muted); max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .th-text { background:linear-gradient(160deg,#127f84,#0a3f45); padding:8px; font-size:9.5px; line-height:1.3; color:#e2fbfb; }
  .th-text span { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .th-app { background:linear-gradient(160deg,#1f3a2e,#122019); display:grid; place-items:center; }
  .th .ai { width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,#5BE49B,#1F7A55); display:grid; place-items:center; font-weight:800; font-size:16px; }
  .th .x { position:absolute; top:4px; right:4px; z-index:2; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.55); display:grid; place-items:center; color:#fff; }
  .pop { animation:pop .45s cubic-bezier(.3,1.6,.5,1) both; }
  .strip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; }
  .strip::-webkit-scrollbar { display:none; }

  /* Settings list + recent (shared structure) */
  .set { border-radius:24px; overflow:hidden; }
  .srow { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .srow + .srow { border-top:1px solid rgba(255,255,255,.07); }
  .sic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg,var(--g1),var(--g2)); color:#fff; flex:none; }
  .srow > div { flex:1; min-width:0; } .srow b { font-size:15px; display:block; } .srow small { font-size:12px; color:var(--muted); }
  .srow.dis { opacity:.38; pointer-events:none; }
  .sw { width:50px; height:30px; border-radius:15px; background:rgba(255,255,255,.14); position:relative; flex:none; transition:background .3s; }
  .sw i { position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#cfc9da; transition:transform .4s cubic-bezier(.3,1.5,.5,1), background .3s; }
  .sw.on { background:var(--accent); } .sw.on i { transform:translateX(20px); background:#fff; }
  .val { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  .rec { border-radius:22px; padding:4px 0; }
  .rrow { display:flex; align-items:center; gap:12px; padding:9px 14px; }
  .rrow .th { width:42px; height:42px; border-radius:12px; }
  .rrow .th .fn, .rrow .th-text span { display:none; }
  .rrow > div:nth-child(2) { flex:1; min-width:0; } .rrow b { font-size:14px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .rrow small { font-size:11.5px; color:var(--muted); }
  .dirb { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; flex:none; }
  .dirb.in { background:rgba(31,169,113,.25); color:#5BE49B; } .dirb.out { background:rgba(255,138,107,.2); color:var(--accent); }
  .hdrow { display:flex; justify-content:space-between; align-items:center; }

  /* Overlays */
  .flyer { position:absolute; margin:0; z-index:1; box-shadow:0 10px 24px rgba(0,0,0,.5); }
  .plane { position:absolute; color:var(--accent); filter:drop-shadow(0 4px 14px rgba(255,138,107,.8)); }
  .toast { position:absolute; top:46px; left:50%; transform:translate(-50%,-24px) scale(.85); opacity:0; z-index:9; background:#000; color:#fff; padding:10px 16px 10px 12px; border-radius:22px;
           font-size:13px; font-weight:600; display:flex; gap:8px; align-items:center; max-width:370px; box-shadow:0 10px 30px rgba(0,0,0,.5);
           transition:all .5s cubic-bezier(.3,1.4,.5,1); pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  .toast span { overflow:hidden; text-overflow:ellipsis; } .toast svg { color:var(--accent); }
  .sheetw { position:absolute; inset:0; z-index:10; pointer-events:none; }
  .sheetw .scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; transition:opacity .3s; }
  .sheetw.open { pointer-events:auto; } .sheetw.open .scrim { opacity:1; }
  .sh { position:absolute; left:8px; right:8px; bottom:8px; border-radius:34px; padding:10px 20px 20px; transform:translateY(115%); transition:transform .5s cubic-bezier(.3,1.15,.5,1);
        background:rgba(30,26,38,.94); border:1px solid rgba(255,255,255,.12); box-shadow:0 -10px 40px rgba(0,0,0,.4); }
  .sheetw.open .sh { transform:none; }
  .grab { width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.25); margin:0 auto 16px; }
  .sh h3 { font-size:21px; font-weight:800; letter-spacing:-.3px; } .sh p { font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .sh textarea, .sh input { width:100%; margin-top:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:16px; color:var(--ink);
        font:15px Roboto, "Segoe UI", sans-serif; padding:12px 14px; outline:none; resize:none; }
  .sh textarea:focus, .sh input:focus { border-color:var(--accent); }
  .shb { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .shb button { height:46px; padding:0 20px; border-radius:23px; font-weight:700; color:var(--accent); }
  .shb .main { background:var(--accent); color:#2A0D06; }

  /* Panel entrance */
  .enter > * { animation:up .55s cubic-bezier(.2,.8,.2,1) both; }
  .enter > *:nth-child(2) { animation-delay:.04s } .enter > *:nth-child(3) { animation-delay:.08s } .enter > *:nth-child(4) { animation-delay:.12s }
  .enter > *:nth-child(5) { animation-delay:.16s } .enter > *:nth-child(6) { animation-delay:.2s } .enter > *:nth-child(n+7) { animation-delay:.24s }
  @keyframes up { from { opacity:0; transform:translateY(14px); } }
  @keyframes pop { from { opacity:0; transform:scale(.6); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .shake { animation:shake .4s; }
  @keyframes shimmer { from { transform:translateX(-120%); } to { transform:translateX(120%); } }
  .spinning svg { animation:spin .9s linear infinite; }

  /* =============== A · ORBIT =============== */
  .segA { position:relative; display:flex; height:54px; border-radius:27px; padding:5px; margin-top:14px; }
  .segA .thumb { position:absolute; left:5px; top:5px; bottom:5px; width:calc(50% - 5px); border-radius:22px;
                 background:linear-gradient(135deg,#FFB49C,#FF8A6B 40%,#E8457A); box-shadow:0 8px 24px -6px rgba(255,110,90,.7), inset 0 1px 0 rgba(255,255,255,.4);
                 transition:transform .6s cubic-bezier(.34,1.45,.5,1); }
  .segA.rx .thumb { transform:translateX(100%); }
  .segA button { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; position:relative; z-index:1; font-weight:700; font-size:15.5px; color:var(--muted); transition:color .35s; }
  .segA button.on { color:#2A0D06; }
  .eyebrow { display:flex; align-items:center; gap:8px; margin:22px 4px 10px; font-size:12px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); }
  .eyebrow.row { justify-content:space-between; margin-bottom:8px; } .eyebrow > span { display:flex; align-items:center; gap:8px; }
  .eyebrow b { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:rgba(255,138,107,.18); color:var(--accent); font-size:11px; letter-spacing:0; }
  .tools { display:flex; gap:6px; }
  .tool { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--ink); }
  .tool.on { color:var(--accent); box-shadow:0 0 0 1px rgba(255,138,107,.55), 0 0 18px rgba(255,138,107,.35); }
  .dA .picks { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .dA .pk { height:98px; border-radius:22px; padding:12px; position:relative; overflow:hidden; text-align:left; display:flex; flex-direction:column; justify-content:flex-end; }
  .dA .pk .blob { position:absolute; top:12px; left:12px; width:40px; height:40px; border-radius:14px; background:linear-gradient(135deg,var(--g1),var(--g2)); display:grid; place-items:center; color:#fff;
                  box-shadow:0 8px 18px -6px var(--g1), inset 0 1px 0 rgba(255,255,255,.35); }
  .dA .pk::after { content:''; position:absolute; right:-34px; top:-34px; width:100px; height:100px; border-radius:50%; background:radial-gradient(var(--g1), transparent 70%); opacity:.25; }
  .dA .pk b { font-size:14.5px; } .dA .pk small { font-size:10.5px; color:var(--muted); }
  .tray { margin-top:12px; border-radius:24px; padding:12px 14px 14px; }
  .tray.in { animation:trayin .5s cubic-bezier(.3,1.3,.5,1) both; }
  @keyframes trayin { from { opacity:0; transform:translateY(-10px) scale(.96); } }
  .tray .hdrow b { font-size:15px; } .tray .hdrow small { display:block; font-size:12px; color:var(--muted); }
  .tray .strip { margin-top:8px; }
  .orbit { position:relative; height:300px; border-radius:28px; overflow:hidden; }
  .orbit .ring { position:absolute; left:50%; top:50%; border-radius:50%; border:1px dashed rgba(255,255,255,.13); transform:translate(-50%,-50%); }
  .orbit .r1 { width:150px; height:150px; } .orbit .r2 { width:270px; height:270px; } .orbit .r3 { width:400px; height:400px; }
  .orbit .sweep { position:absolute; left:50%; top:50%; width:440px; height:440px; margin:-220px; border-radius:50%;
                  background:conic-gradient(from 0deg, transparent 0 72%, rgba(255,138,107,.22) 100%); animation:spin 5s linear infinite; animation-delay:var(--neg); }
  .orbit .rip { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px; border-radius:50%; border:1.5px solid rgba(255,138,107,.55); animation:rip 3.6s ease-out infinite; animation-delay:var(--neg); }
  .orbit .rip.d2 { animation-delay:calc(var(--neg) - 1.2s); } .orbit .rip.d3 { animation-delay:calc(var(--neg) - 2.4s); }
  @keyframes rip { from { transform:scale(1); opacity:.8; } to { transform:scale(5.2); opacity:0; } }
  .orbit svg.beams { position:absolute; inset:0; }
  .beam { stroke:rgba(255,255,255,.07); stroke-width:1.5; }
  .armed .beam:not(.dim) { stroke:rgba(255,138,107,.6); stroke-dasharray:3 7; animation:dash .9s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-20; } }
  .me { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px; border-radius:50%; display:grid; place-items:center; color:#2A0D06;
        background:radial-gradient(circle at 32% 30%,#FFC9B4,#FF8A6B 42%,#8E1F3E); box-shadow:0 0 0 7px rgba(255,138,107,.12), 0 12px 40px rgba(255,110,90,.55); }
  .me span { position:absolute; top:70px; font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; }

/* ---------------- Effects ---------------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function rel(el) { const p = phone.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: (r.left - p.left) / scale, y: (r.top - p.top) / scale, w: r.width / scale, h: r.height / scale }; }
function flyThumbs(src, target) {
  const t = rel(target), tx = t.x + t.w / 2, ty = t.y + t.h / 2;
  return Promise.all(src.slice(-6).map((el, i) => {
    const r = rel(el), c = el.cloneNode(true);
    c.classList.add('flyer'); c.classList.remove('pop');
    Object.assign(c.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', transform: 'none', animation: 'none' });
    fxEl.appendChild(c); el.style.opacity = .2;
    const dx = tx - (r.x + r.w / 2), dy = ty - (r.y + r.h / 2);
    return c.animate([
      { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1 },
      { transform: `translate(${dx * .45}px,${dy * .45 - 70}px) scale(.8) rotate(${i % 2 ? 14 : -14}deg)`, opacity: 1, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) scale(.12) rotate(0)`, opacity: .2 },
    ], { duration: 640, delay: i * 70, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).finished.then(() => c.remove());
  }));
}
function plane(from) {
  const r = rel(from), p = document.createElement('div');
  p.className = 'plane'; p.innerHTML = ic('send', 30);
  Object.assign(p.style, { left: r.x + r.w / 2 - 15 + 'px', top: r.y + r.h / 2 - 15 + 'px' });
  fxEl.appendChild(p);
  p.animate([
    { transform: 'translate(0,0) rotate(0) scale(.5)', opacity: 0 },
    { transform: 'translate(20px,-50px) rotate(-8deg) scale(1.35)', opacity: 1, offset: .3 },
    { transform: 'translate(210px,-420px) rotate(-22deg) scale(.8)', opacity: 0 },
  ], { duration: 820, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' }).finished.then(() => p.remove());
}
function toast(msg, icon) {
  const t = $('#toast');
  t.innerHTML = (icon ? ic(icon, 16) : '') + `<span>${msg}</span>`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function sheet(title, body, actions) {
  const w = $('#sheet');
  w.innerHTML = `<div class="scrim" data-act="sheetclose"></div><div class="sh"><div class="grab"></div><h3>${title}</h3>${body}<div class="shb">${actions.map((a, i) => `<button class="${a.main ? 'main' : ''}" data-sact="${i}">${a.label}</button>`).join('')}</div></div>`;
  void w.offsetWidth; w.classList.add('open');
  w.onclick = e => { const b = e.target.closest('[data-sact]'); if (!b) return; const a = actions[+b.dataset.sact]; if (a.run?.(w) !== false) closeSheet(); };
  setTimeout(() => { $('textarea, input', w)?.focus({ preventScroll: true }); phone.scrollTop = 0; }, 520);
}
const closeSheet = () => { $('#sheet').classList.remove('open'); phone.scrollTop = 0; };

/* ---------------- Actions ---------------- */
function addItems(list) {
  if (!S.items.length) { fx.trayIn = true; fx.barIn = true; }
  list.forEach(i => fx.newItems.add(i.id)); S.items.push(...list); render();
}
function pick(k) {
  if (k === 'text') return sheet('Send a message', `<textarea rows="3" placeholder="A link, an address, a note…">Meet at the north gate at 6 🌅</textarea>`, [
    { label: 'Cancel' }, { label: 'Add', main: true, run: w => { const v = $('textarea', w).value.trim(); if (v) addItems([mk('text', { text: v, size: v.length })]); } }]);
  if (k === 'media') toast('Opens the gallery picker · 4 picked', 'image');
  if (k === 'folder') toast('Added 3 files from “Trip notes”', 'folder');
  if (k === 'paste') toast('Pasted from the clipboard', 'clip');
  if (k === 'apps') toast('Opens the app picker · 1 picked', 'apps');
  addItems(ADD[k]());
}
async function tapDevice(id, el) {
  if (S.busy) return;
  const d = DEV[id];
  if (!S.items.length) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); toast('Pick something to send first', 'info'); return; }
  S.busy = true;
  const n = describe(S.items);
  await DIRS[S.dir].sendFx(id, () => {
    S.items = []; S.tray = false; S.active++; render();
    toast(d.online ? `Sending ${n} to ${d.name} · opens transfer screen` : `Queued for ${d.name} · sends when it shows up`, 'send');
    setTimeout(() => { S.active = Math.max(0, S.active - 1); const b = $('[data-k="badge"]'); if (b) { b.textContent = S.active; b.hidden = !S.active; } }, 7000);
  });
  S.busy = false;
}
function favToggle(id) {
  const d = DEV[id];
  if (d.kind === 'nearby') return toast("Nearby phones can't be favourites", 'bt');
  S.favs[id] = !S.favs[id]; render();
  toast(S.favs[id] ? `${d.name} ♥ · shows first, auto-accepted` : 'Unfavourited', 'heart');
}
function setReceiving(on) {
  S.receiving = on;
  if (!on) { S.session = null; clearInterval(timer); }
  render();
  toast(on ? `Receiving · visible as ${ME}` : 'Receiving stopped', on ? 'wifi' : 'power');
}
function startSession() {
  clearInterval(timer);
  if (!S.receiving) return;
  S.session = { from: 'Energetic Avocado', total: 12, done: 0, bytes: 0, totalBytes: 126e6, finished: false };
  render();
  timer = setInterval(() => {
    const s = S.session; if (!s) return clearInterval(timer);
    s.bytes = Math.min(s.totalBytes, s.bytes + s.totalBytes / (48 + Math.random() * 14));
    s.done = Math.floor(s.bytes / s.totalBytes * s.total);
    if (s.bytes >= s.totalBytes) { s.done = s.total; s.finished = true; clearInterval(timer); render(); toast('Got 12 from Energetic Avocado · in the ShareBro album', 'check'); return; }
    const p = sessP(s);
    $$('[data-k="pct"]').forEach(e => e.textContent = Math.round(p * 100) + '%');
    $$('[data-k="pctn"]').forEach(e => e.textContent = Math.round(p * 100));
    $$('[data-k="bar"]').forEach(e => e.style.width = p * 100 + '%');
    $$('[data-k="ring"]').forEach(e => e.style.strokeDashoffset = RC * (1 - p));
    $$('[data-k="liq"]').forEach(e => e.style.setProperty('--p', p));
    $$('[data-k="meta"]').forEach(e => e.textContent = sessMeta(s));
    $$('[data-k="arr"]').forEach(e => { while (e.children.length < s.done) { const i = e.children.length, t = document.createElement('i'); t.style.background = `linear-gradient(160deg,${PH[i % 7][0]},${PH[i % 7][1]})`; e.appendChild(t); } });
  }, 120);
}
function act(a, el) {
  const [k, v] = a.split(':');
  switch (k) {
    case 'tab': if (S.tab !== v) { S.tab = v; S.tray = false; fx.enter = true; fx.barIn = true; render(); scroll.scrollTo({ top: 0 }); } break;
    case 'pick': pick(v); break;
    case 'clear': S.items = []; S.tray = false; render(); break;
    case 'rm': S.items = S.items.filter(i => i.id !== +v); if (!S.items.length) S.tray = false; render(); break;
    case 'dev': tapDevice(v, el); break;
    case 'rescan': el.classList.add('spinning'); toast('Scanning the network…', 'refresh'); setTimeout(() => el.classList.remove('spinning'), 1500); break;
    case 'bt': S.bt = !S.bt; if (S.bt) fx.newDev = 'ravi'; render(); toast(S.bt ? 'Finding ShareBro phones without Wi-Fi' : 'Nearby off', 'bt'); break;
    case 'ip': sheet('Connect by address', `<p>The other device shows its address on its Receive screen (LocalSend: Settings › Network).</p><input inputmode="decimal" placeholder="192.168.1.23">`, [
      { label: 'Cancel' }, { label: 'Connect', main: true, run: w => { const v = $('input', w).value.trim() || '192.168.1.23'; toast(`Nothing answered at ${v}. Is LocalSend open there?`, 'hash'); } }]); break;
    case 'qr': if (!S.items.length) return toast('Pick something first', 'info'); toast('Opens Link / QR · any browser can download', 'qr'); break;
    case 'apps': if (!S.items.length) return toast('Pick something first', 'info'); toast("Opens Android's share sheet", 'share'); break;
    case 'recv': setReceiving(!S.receiving); break;
    case 'sw': if (v === 'auto' && S.quick) return; S[v] = !S[v]; syncSettings(); break;
    case 'pin': sheet('Receive PIN', `<p>Senders have to type this code before anything arrives. Leave it empty to turn the PIN off.</p><input inputmode="numeric" maxlength="6" value="${S.pin || '4821'}">`, [
      ...(S.pin ? [{ label: 'Turn off', run: () => { S.pin = null; syncSettings(); } }] : []), { label: 'Cancel' },
      { label: 'Save', main: true, run: w => { S.pin = $('input', w).value.trim() || null; syncSettings(); } }]); break;
    case 'history': toast('Opens History · all / received / sent', 'history'); break;
    case 'outbox': toast(S.active ? `Opens Sending · ${S.active} active` : 'Opens Sending · nothing active', 'outbox'); break;
    case 'session': toast('Opens the live receive screen', 'download'); break;
    case 'info': S.info = !S.info; render(); break;
    case 'tray': S.tray = !S.tray; render(); break;
    case 'sheetclose': closeSheet(); break;
  }
}
phone.addEventListener('click', e => {
  if (S.lp) { S.lp = false; return; }
  const el = e.target.closest('[data-act]'); if (el) act(el.dataset.act, el);
});
// Long-press a device: favourite.
let lpT, lpX, lpY;
phone.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-act^="dev:"]');
  if (d) { lpX = e.clientX; lpY = e.clientY; clearTimeout(lpT); lpT = setTimeout(() => { S.lp = true; favToggle(d.dataset.act.slice(4)); }, 550); }
  const tr = e.target.closest('[data-slide]'); if (tr) slideStart(e, tr);
});
phone.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - lpX, e.clientY - lpY) > 8) clearTimeout(lpT); });
['pointerup', 'pointercancel'].forEach(t => phone.addEventListener(t, () => clearTimeout(lpT)));
// Slide to start / stop receiving (direction C).
function slideStart(e, tr) {
  e.preventDefault();
  const knob = $('.knob', tr), max = tr.clientWidth - 60, start = S.receiving ? max : 0, x0 = e.clientX;
  let moved = 0;
  tr.classList.add('drag'); tr.setPointerCapture(e.pointerId);
  const pos = () => Math.max(0, Math.min(max, start + moved));
  const mv = ev => { moved = (ev.clientX - x0) / scale; knob.style.transform = `translateX(${pos()}px)`; };
  const up = () => {
    tr.removeEventListener('pointermove', mv); tr.removeEventListener('pointerup', up); tr.classList.remove('drag');
    const tap = Math.abs(moved) < 4, x = pos();
    if (tap || (S.receiving ? x < max * .5 : x > max * .6)) { if (!tap) S.slideFrom = x; setReceiving(!S.receiving); }
    else knob.style.transform = '';
  };
  tr.addEventListener('pointermove', mv); tr.addEventListener('pointerup', up);
}

/* ---------------- Presets & side panel ---------------- */
function reset() { S.gen++; clearInterval(timer); closeSheet(); S.session = null; S.tray = false; S.busy = false; $('#fx').innerHTML = ''; }
const PRE = {
  send0() { reset(); S.tab = 'send'; S.items = []; fx.enter = true; render(); scroll.scrollTo({ top: 0 }); },
  send1() { reset(); S.tab = 'send'; S.bt = true; S.items = sample(); S.items.forEach(i => fx.newItems.add(i.id)); fx.enter = fx.trayIn = fx.barIn = true; render(); scroll.scrollTo({ top: 0 }); },
  async send2() {
    PRE.send1(); const g = S.gen; await wait(700); if (g !== S.gen) return;
    const t = $('[data-id="maya"]'); if (S.dir !== 'C') t.scrollIntoView({ block: 'center', behavior: 'smooth' }); else $('.cards').scrollIntoView({ block: 'center', behavior: 'smooth' });
    await wait(600); if (g === S.gen) tapDevice('maya', t);
  },
  recv0() { reset(); S.tab = 'receive'; S.receiving = false; fx.enter = true; render(); scroll.scrollTo({ top: 0 }); },
  recv1() { reset(); S.tab = 'receive'; S.receiving = false; fx.enter = true; render(); scroll.scrollTo({ top: 0 }); const g = S.gen; setTimeout(() => { if (g !== S.gen) return; setReceiving(true); setTimeout(() => g === S.gen && startSession(), 1300); }, 500); },
};
$$('[data-st]').forEach(b => b.onclick = () => PRE[b.dataset.st]());
$$('#dirs button').forEach(b => b.onclick = () => { S.dir = b.dataset.dir; S.tray = false; fx.enter = true; fx.barIn = true; render(); });
const TIPS = {
  A: ['<b>Pick tiles</b> are glass cards with a jewel-tone icon; picking fills a tray with removable thumbnails.',
      '<b>Devices orbit you</b> on a live radar. Once something is picked, beams light up and each device breathes: tap one and your items fly into it, a ring closes and the paper plane takes off.',
      '<b>Long-press</b> a device to favourite it (heart badge). Scan, Nearby (Bluetooth) and connect-by-address sit beside "Tap a device".',
      '<b>Receive</b> is one hero card: an orb that ignites with ripples and a sweep when you start receiving, live progress with a ring and arriving thumbnails, then a settings list and recent transfers.'],
  B: ['<b>Quiet by design:</b> darker veil, solid surfaces, coral used only where it matters (the underline, the Send buttons, the switch).',
      '<b>Selection lives in a floating send bar</b> above the dock (stacked thumbnails, Link/QR, share, clear). Tap it to expand and remove items.',
      '<b>Devices are one clean list.</b> With items picked, each row shows a coral Send pill; tapping sweeps the row and drops the bar.',

      '<b>Devices are swipeable cards</b> (favourites first, offline ones desaturated, a card for connect-by-address). Picked items fly into the card you tap.',

      '<b>Incoming</b> fills a liquid orb; options are three toggle tiles (Quick save, Favourites, PIN).'],
};

/* ---------------- Static chrome ---------------- */
$('#dock').innerHTML = '<div class="drop"></div>' + [['people', 'People'], ['image', 'Photos'], ['albums', 'Albums'], ['explore', 'Explore'], ['swap', 'Share']]
  .map(([i, l], n) => `<div class="tab ${n === 4 ? 'on' : ''}">${ic(i, 24)}<span>${l}</span></div>`).join('');
$('#sicons').innerHTML = `<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>${ic('wifi', 16)}<svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="rgba(255,255,255,.5)"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="#fff"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="rgba(255,255,255,.5)"/></svg>`;
function fit() {
  const avail = Math.min(window.innerHeight - 48, 900) / 916, w = Math.min(window.innerWidth - 32, 460) / 436;
  scale = Math.max(.5, Math.min(1, avail, w));
  const st = $('#stage'); st.style.width = 436 * scale + 'px'; st.style.height = 916 * scale + 'px';
  Object.assign(phone.style, { transform: `scale(${scale})`, left: 12 * scale + 'px', top: 12 * scale + 'px' });
}
window.addEventListener('resize', fit);
fit(); render();
</script>
