<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Animation Options</title>
<style>
:root{--page:#ECE9EF;--card:#fff;--ink:#141217;--sub:#6b6670;--line:rgba(26,24,32,.12);--surface:#F6F3F1;--tile:#F6F3F1}
:root[data-theme=dark]{--page:#050407;--card:#1b1a1f;--ink:#F2EFF4;--sub:#a29ca8;--line:rgba(255,255,255,.12);--surface:#0E0D12;--tile:#F6F3F1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#050407;--card:#1b1a1f;--ink:#F2EFF4;--sub:#a29ca8;--line:rgba(255,255,255,.12);--surface:#0E0D12}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px 16px 48px}
header{max-width:1200px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opt h2{margin:0;font-size:16px}
.opt p{margin:0;color:var(--sub);font-size:13px;min-height:54px}
.screen{height:420px;border-radius:30px;background:var(--surface);border:6px solid #000;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen svg{width:210px;height:180px;overflow:visible}
.word{font-weight:800;font-size:24px;letter-spacing:-.4px;margin-top:6px;opacity:0;animation:word .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes word{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.replay{align-self:flex-start;font-size:13px;padding:6px 12px}
/* every piece animates in its own frame: 0 0 is the piece's middle */
svg *{transform-box:view-box}
.tile{fill:var(--tile)}
:root[data-theme=dark] .tile{fill:#F6F3F1}

/* ---------- A · Lean in: phones slide in upright, tip toward each other, touch, spark ---------- */
.A .pl{animation:Apl 1.1s cubic-bezier(.3,1.25,.4,1) both}
.A .pr{animation:Apr 1.1s cubic-bezier(.3,1.25,.4,1) both}
@keyframes Apl{0%{transform:translate(-70px,0) rotate(-22.5deg);opacity:0}25%{opacity:1}55%{transform:translate(0,0) rotate(-22.5deg)}100%{transform:none}}
@keyframes Apr{0%{transform:translate(70px,0) rotate(22.5deg);opacity:0}25%{opacity:1}55%{transform:translate(0,0) rotate(22.5deg)}100%{transform:none}}
.A .spark path{animation:ray .45s .95s cubic-bezier(.2,1.4,.4,1) both}
.A .word{animation-delay:1.15s}

/* ---------- B · Photo hop: a photo jumps from one screen to the other ---------- */
.B .pl,.B .pr{animation:fadein .4s both}
.B .flyer{transform:translate(40.3px,57.6px) scale(.55);opacity:0;animation:hop 1s .45s cubic-bezier(.45,0,.25,1) both}
@keyframes hop{0%{transform:translate(40.3px,57.6px) rotate(22.5deg) scale(.9);opacity:0}10%{opacity:1}55%{transform:translate(54px,30px) scale(.5) rotate(-8deg)}100%{transform:translate(67.7px,57.6px) scale(.55) rotate(-22.5deg);opacity:0}}
.B .rphoto{animation:fadein .35s 1.3s both}
.B .rdark{animation:fadeout .35s 1.3s both}
.B .spark path{animation:ray .45s 1.35s cubic-bezier(.2,1.4,.4,1) both}
.B .word{animation-delay:1.5s}

/* ---------- C · Sunrise: screens wake, suns rise, hills roll up ---------- */
.C .pl,.C .pr{animation:pop .55s cubic-bezier(.3,1.4,.4,1) both}
.C .pr{animation-delay:.1s}
.C .sun{animation:rise .8s .45s cubic-bezier(.2,.9,.3,1.1) both}
.C .h1{animation:roll .7s .55s cubic-bezier(.2,.9,.3,1) both}
.C .h2{animation:roll .7s .7s cubic-bezier(.2,.9,.3,1) both}
.C .scr{animation:wake .6s .3s both}
@keyframes rise{from{transform:translateY(14px)}}
@keyframes roll{from{transform:translateY(16px)}}
@keyframes wake{from{filter:brightness(.25)}}
.C .spark path{animation:ray .45s 1.2s cubic-bezier(.2,1.4,.4,1) both}
.C .word{animation-delay:1.3s}

/* ---------- D · Clink: phones drop in from above and clink like glasses ---------- */
.D .pl{animation:Dl 1.15s both}
.D .pr{animation:Dr 1.15s both}
@keyframes Dl{0%{transform:translate(-14px,-120px) rotate(-30deg);opacity:0;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  45%{transform:translate(-4px,0) rotate(-6deg);opacity:1;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  62%{transform:translate(2px,-1px) rotate(6deg)}78%{transform:translate(-1px,0) rotate(-2deg)}100%{transform:none}}
@keyframes Dr{0%{transform:translate(14px,-120px) rotate(30deg);opacity:0;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  45%{transform:translate(4px,0) rotate(6deg);opacity:1;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  62%{transform:translate(-2px,-1px) rotate(-6deg)}78%{transform:translate(1px,0) rotate(2deg)}100%{transform:none}}
.D .spark path{animation:ray .45s .62s cubic-bezier(.2,1.4,.4,1) both}
.D .ring{animation:ring .7s .6s ease-out both}
@keyframes ring{from{r:1;opacity:.6}to{r:22;opacity:0}}
.D .word{animation-delay:1.05s}

/* ---------- E · Sketch: outlines draw themselves, then colour floods in ---------- */
.E .outline{fill:none;stroke-width:.9;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .8s cubic-bezier(.6,0,.3,1) forwards}
.E .outline.r{animation-delay:.12s}
.E .fill{animation:fadein .4s .75s both}
.E .fill.r{animation-delay:.85s}
@keyframes draw{to{stroke-dashoffset:0}}
.E .spark path{animation:ray .45s 1.15s cubic-bezier(.2,1.4,.4,1) both}
.E .word{animation-delay:1.3s}

/* ---------- F · Tile: the icon tile lands, phones rise out of it ---------- */
.F .tile{animation:tile .5s cubic-bezier(.3,1.4,.4,1) both;transform-origin:54px 54px}
.F svg{width:200px;height:200px}
.F .pl,.F .pr{animation:riseUp .7s cubic-bezier(.3,1.3,.4,1) both}
.F .pl{animation-delay:.3s}.F .pr{animation-delay:.42s}
@keyframes tile{from{transform:scale(0) rotate(-12deg)}}
@keyframes riseUp{from{transform:translateY(26px) scale(.6);opacity:0}}
.F .spark path{animation:ray .45s .95s cubic-bezier(.2,1.4,.4,1) both}
.F .word{animation-delay:1.1s}

/* shared */
@keyframes ray{from{stroke-dasharray:0 10;opacity:0}to{stroke-dasharray:10 0;opacity:1}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.spark path{stroke:#E5533A;stroke-width:1.4;stroke-linecap:round;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Opening animation: pick one</h1>
  <div style="display:flex;gap:8px">
    <button id="all">Replay all</button>
    <button id="theme">Switch light / dark</button>
  </div>
</header>
<div class="grid" id="grid"></div>



<script>
let uid=0;
// One phone, upright and centred on 0,0 (sizes from tool/make_icon.py).
function phone(c,{dark=false}={}){
  const id='c'+(uid++);
  const scr='x="-8.1" y="-13.4" width="16.2" height="28.9" rx="3.3"';
  return `<rect x="-9.37" y="-16.7" width="18.74" height="33.4" rx="4.37" fill="${c.body}"></rect>
    <clipPath id="${id}"><rect ${scr}></rect></clipPath>
    <g class="scr ${dark?'rphoto':''}">
      <rect ${scr} fill="${c.sky}"></rect>
      <g clip-path="url(#${id})">
        <circle class="sun" cx="2.6" cy="-5.2" r="2.1" fill="${c.sun}"></circle>
        <path class="h1" d="M-8.1 4.5 L-2.6 -0.6 L0.2 6 L4 3.5 L8.1 9 L8.1 15.5 L-8.1 15.5Z" fill="${c.h1}"></path>
        <path class="h2" d="M-8.1 9.6 L-2.6 7.4 L0 12 L3 10.6 L5.5 12.2 L8.1 15.5 L-8.1 15.5Z" fill="${c.h2}"></path>
      </g>
    </g>
    ${dark?`<rect class="rdark" ${scr} fill="#26232A"></rect>`:''}
    <rect x="-2.1" y="-15.6" width="4.2" height="1.24" rx=".62" fill="${c.slot}"></rect>`;
}
const LEFT={body:'#E5533A',sky:'#FDE3DA',sun:'#FF8A6B',h1:'#FFC3B2',h2:'#FF8A6B',slot:'#B23A25'};
const RIGHT={body:'#141217',sky:'#3A353F',sun:'#FF8A6B',h1:'#5A5560',h2:'#8A8590',slot:'#000'};
// Where the phones sit in the 108 grid.
const PL='translate(40.3 57.6)',PR='translate(67.7 57.6)';
const spark=`<g class="spark"><path d="M54 36.3 L54 32.8"></path><path d="M55.9 37.2 L58.6 35"></path><path d="M52.1 37.2 L49.4 35"></path></g>`;
function logo({tile=false,under='',over='',lcls='pl',rcls='pr',darkRight=false}={}){
  return `<svg viewBox="${tile?'10 10 88 88':'20 24 68 58'}">
    ${tile?'<rect class="tile" x="14" y="14" width="80" height="80" rx="20"></rect>':''}
    ${under}
    <g transform="${PL}"><g class="${lcls}"><g transform="rotate(22.5)">${phone(LEFT)}</g></g></g>
    <g transform="${PR}"><g class="${rcls}"><g transform="rotate(-22.5)">${phone(RIGHT,{dark:darkRight})}</g></g></g>
    ${over}${spark}</svg>`;
}
const flyer=`<g class="flyer"><g><rect x="-8.1" y="-13.4" width="16.2" height="28.9" rx="3.3" fill="#FDE3DA"></rect><circle cx="2.6" cy="-5.2" r="2.1" fill="#FF8A6B"></circle><path d="M-8.1 4.5 L-2.6 -0.6 L0.2 6 L4 3.5 L8.1 9 L8.1 15.5 L-8.1 15.5Z" fill="#FFC3B2"></path></g></g>`;
const outline=(t,c,r,cls)=>`<g transform="${t}"><g transform="rotate(${r})"><rect class="outline ${cls}" x="-9.37" y="-16.7" width="18.74" height="33.4" rx="4.37" stroke="${c}"></rect></g></g>`;
const OPTIONS=[
  ['A','Lean in','The phones slide in from the sides standing straight, tip toward each other until they touch, and the spark flicks on.',()=>logo()],
  ['B','Photo hop','Both phones appear; a photo jumps from the coral phone to the dark one, which lights up with it. Says exactly what the app does.',()=>logo({over:flyer,darkRight:true})],
  ['C','Sunrise','The phones pop up with dark screens; the screens wake, the suns rise and the hills roll up, like the morning of a trip.',()=>logo()],
  ['D','Clink','The phones drop in from above and clink at the top like two glasses in a toast, with a little ring and the spark. The most playful.',()=>logo({over:'<circle class="ring" cx="54" cy="40" r="1" fill="none" stroke="#E5533A" stroke-width=".8"></circle>'})],
  ['E','Sketch','The outlines draw themselves in coral and ink, then the colour floods in. Calm and crafted.',()=>logo({lcls:'pl fill',rcls:'pr fill r',over:outline(PL,'#E5533A',22.5,'')+outline(PR,'#141217',-22.5,'r')})],
  ['F','Tile','The cream icon tile lands with a twist, the two phones rise out of it one after the other, then the spark. Feels like the home-screen icon opening.',()=>logo({tile:true})],
];
const grid=document.getElementById('grid');
OPTIONS.forEach(([k,name,desc,make])=>{
  const card=document.createElement('div');card.className='opt';
  card.innerHTML=`<h2>${k} · ${name}</h2><p>${desc}</p><div class="screen ${k}"></div><button class="replay">Replay</button>`;
  const scr=card.querySelector('.screen');
  const play=()=>{scr.innerHTML=make()+'<div class="word">ShareBro</div>'};
  card.querySelector('.replay').onclick=play;play();
  grid.appendChild(card);
});
document.getElementById('all').onclick=()=>document.querySelectorAll('.replay').forEach(b=>b.click());
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'};
</script>
</body>
</html>
